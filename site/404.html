<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable, Axel Plais</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#F3EEE6">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="preload" href="/assets/fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/tailwind.css">
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="selection:bg-accent selection:text-paper">
    <main id="contenu" class="min-h-[100svh] flex flex-col justify-center px-5 md:px-12 py-16">
        <div class="page-wrap w-full">
            <div class="flex items-center justify-between text-xs text-neutral-400 mb-10 md:mb-16">
                <div class="flex items-center gap-4">
                    <span>Portfolio 2026</span>
                    <span class="w-[2px] h-4 bg-sage"></span>
                    <span class="text-ink">Page introuvable</span>
                </div>
                <span class="font-mono bg-accent text-paper px-3 py-1.5">404</span>
            </div>
            <h1 class="font-serif italic text-[18vw] md:text-[11vw] leading-none text-ink">Hors plan.</h1>
            <p class="mt-8 max-w-xl text-neutral-400 font-light leading-relaxed">Cette page n’existe pas, ou elle a été déplacée. Le reste du portfolio est toujours là.</p>
            <a href="/" class="mt-10 inline-flex items-center gap-6 border border-ink px-4 py-3 text-xs text-ink hover:bg-ink hover:text-paper transition">Retour à l’accueil</a>
            <div class="mt-16 md:mt-24 grid grid-cols-2 md:grid-cols-5 border border-neutral-500/60 text-sm text-neutral-500">
                <div class="p-3 border-r border-b md:border-b-0 border-neutral-500/60"><div class="text-neutral-400 mb-1">Titre</div><div class="text-ink">Erreur 404</div></div>
                <div class="p-3 border-b md:border-b-0 md:border-r border-neutral-500/60"><div class="text-neutral-400 mb-1">Auteur</div><div class="text-ink">A. Plais</div></div>
                <div class="p-3 border-r border-b md:border-b-0 border-neutral-500/60"><div class="text-neutral-400 mb-1">Échelle</div><div class="text-ink">1:1</div></div>
                <div class="p-3 border-b md:border-b-0 md:border-r border-neutral-500/60"><div class="text-neutral-400 mb-1">Rév.</div><div class="text-ink">2026.11</div></div>
                <div class="p-3 col-span-2 md:col-span-1"><div class="text-neutral-400 mb-1">Droits</div><div class="text-ink">© 2026 Axel Plais</div></div>
            </div>
        </div>
    </main>
</body>
</html>
